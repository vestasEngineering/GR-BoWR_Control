<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LISM Centroid Study</title><style>
:root{color-scheme:dark;--bg:#091018;--card:#121e2a;--line:#2c4357;--text:#edf5fb;--muted:#a8bdcd;--blue:#229bd3;--danger:#a83b47;--gold:#ffd166;--green:#66d99a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui}.bar{position:sticky;top:0;z-index:5;display:flex;gap:14px;align-items:center;padding:13px 20px;background:#121e2af5;border-bottom:1px solid var(--line)}.bar strong{font-size:18px}.bar span:last-child{margin-left:auto}main{max-width:1600px;margin:auto;padding:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.setup{margin-bottom:12px}.row,.toolbar,.tabs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.fields{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.workspace{display:grid;grid-template-columns:minmax(0,3fr) minmax(320px,1fr);gap:12px}.side{position:sticky;top:75px;align-self:start}label{display:block;color:var(--muted);font-size:12px;margin:7px 0 3px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:9px;background:#0b151f;color:var(--text);border:1px solid #3c566c;border-radius:8px}textarea{min-height:72px}button{padding:9px 12px;color:var(--text);font-weight:650;background:#1b2c3b;border:1px solid #416078;border-radius:8px;cursor:pointer}button:disabled{opacity:.4}.primary{background:#167cad;border-color:#39afe4}.danger{background:var(--danger);border-color:#e06772}.tabs{margin:12px 0}.tabs button.active{background:#216f98;border-color:#66c0e8}canvas{width:100%;height:540px;background:#050b10;border:1px solid #23394b;border-radius:9px;cursor:crosshair}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:9px}.metric,.diagnostics{background:#0b151f;border-radius:8px;padding:8px}.metric span{display:block;color:var(--muted);font-size:11px}.metric b{font-size:16px}.section{padding:12px 0;border-top:1px solid var(--line)}.section:first-child{border:0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.wide{grid-column:1/-1}.hint,.muted{color:var(--muted)}.message{min-height:24px;white-space:pre-wrap}.success{color:var(--green)}.error{color:#ff8994}.badge{padding:3px 8px;background:#20384b;border-radius:99px;font-size:12px}.queue{font-size:13px;color:var(--muted)}dialog{max-width:520px;width:calc(100% - 30px);padding:18px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:13px}dialog::backdrop{background:#000b}@media(max-width:1050px){.workspace{grid-template-columns:1fr}.side{position:static}.fields{grid-template-columns:1fr 1fr}}@media(max-width:650px){.fields,.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><header class="bar"><strong>LISM Centroid Study</strong><span id="studyBadge" class="badge">No study</span><span id="topStatus" class="muted">Ready</span></header><main>
<section class="card setup"><div class="fields"><div><label>Study name</label><input id="studyName" value="centroid-study"></div><div><label>Session</label><input id="session" value="center"></div><div><label>Operator</label><input id="operator"></div><div><label>Target</label><input id="target" type="number" value="200"></div><div><label>Existing study path</label><input id="studyPath" placeholder="centroid_studies/..."></div></div><div class="row" style="margin-top:10px"><button id="start" class="primary">Begin capture</button><button id="stop">Stop</button><button id="open">Open existing study</button><span id="captureState" class="muted"></span></div></section>
<nav class="tabs"><button data-mode="annotate" class="active">1. Annotate</button><button data-mode="outliers">2. Accepted outliers</button><button data-mode="false_triggers">3. False triggers</button><button data-mode="detector">4. Detector evidence</button><button id="report">5. Generate report</button></nav>
<div id="dashboard" class="card" style="margin-bottom:12px"></div><div class="workspace"><section class="card"><div class="toolbar"><button id="previous">Previous</button><button id="next">Next</button><span id="queueState" class="queue"></span><span style="flex:1"></span><label><input id="blind" type="checkbox" checked> Blind</label><button id="reveal">Reveal overlays</button></div><h2>Frame <span id="frameNumber">0 / 0</span></h2><canvas id="plot" width="1400" height="540"></canvas><div class="metrics"><div class="metric"><span>Left</span><b id="leftText">n/a</b></div><div class="metric"><span>Right</span><b id="rightText">n/a</b></div><div class="metric"><span>Width</span><b id="widthText">n/a</b></div><div class="metric"><span>Midpoint</span><b id="midText">n/a</b></div><div class="metric"><span>Cursor</span><b id="cursorText">n/a</b></div></div><pre id="diagnostics" class="diagnostics"></pre></section>
<aside class="card side"><div class="section"><h2 id="panelTitle">Annotation</h2><span id="frameStatus" class="badge">No frame</span><div id="annotationFields"><label>Disposition</label><select id="status"><option value="accepted">Accepted</option><option value="uncertain">Uncertain but usable</option></select><label>Confidence</label><select id="confidence"><option>high</option><option>medium</option><option>low</option></select><label>Detector region</label><select id="assessment"><option value="not_assessed">Not assessed</option><option value="correct">Correct</option><option value="wrong">Wrong</option><option value="partial">Partial</option><option value="merged">Merged</option></select></div><div id="reviewFields"><label id="reviewLabel">Review classification</label><select id="reviewDisposition"></select><label>Review note</label><textarea id="reviewNote"></textarea></div><label>General note</label><textarea id="note"></textarea></div><div class="section actions"><button id="clear">Clear edges</button><button id="save" class="primary">Save</button><button id="saveNext" class="primary wide">Save and next</button><button id="reject" class="danger wide">Reject trigger</button></div><div id="message" class="message"></div></aside></div></main>
<dialog id="rejectDialog"><h2>Reject qualified trigger</h2><label>Reason</label><select id="rejectReason"><option value="false_trigger">False trigger</option><option value="wrong_detector_region">Wrong detector region</option><option value="multiple_footprints">Multiple footprints</option><option value="footprint_outside_sensor">Outside sensor</option><option value="both_edges_ambiguous">Edges ambiguous</option><option value="corrupted_frame">Corrupted frame</option><option value="duplicate_or_residual">Duplicate or residual</option><option value="other">Other</option></select><label>False-trigger family</label><select id="falseFamily"><option value="unreviewed">Unreviewed</option><option value="no_coherent_footprint">No coherent footprint</option><option value="fixed_sensor_artifact">Fixed sensor artifact</option><option value="single_deep_glitch">Single deep glitch</option><option value="broad_baseline_disturbance">Broad baseline disturbance</option><option value="fragmented_noise">Fragmented noise</option><option value="wrong_region_stronger_than_laser">Wrong region stronger than laser</option><option value="multiple_regions">Multiple regions</option><option value="residual_or_duplicate_transfer">Residual/duplicate transfer</option><option value="malformed_frame">Malformed</option><option value="unknown">Unknown</option></select><label>Note</label><textarea id="rejectNote"></textarea><div class="row" style="margin-top:10px"><button id="cancelReject">Cancel</button><button id="confirmReject" class="danger">Reject and continue</button></div></dialog>
<script>
const $=id=>document.getElementById(id);let state,current,analysis,mode='annotate',queue=[],position=0,left=null,right=null,activeEdge=0,dirty=false,busy=false,overlays=false;const canvas=$('plot'),ctx=canvas.getContext('2d');const outlierOptions=[['unreviewed','Unreviewed'],['valid_difficult','Valid difficult frame'],['manual_annotation_corrected','Manual annotation corrected'],['wrong_detector_region','Wrong detector region'],['partial_footprint','Partial footprint'],['merged_responses','Merged responses'],['corrupted_or_residual','Corrupted or residual'],['should_be_rejected','Should be rejected'],['unexplained','Unexplained']];const falseOptions=[['unreviewed','Unreviewed'],['no_coherent_footprint','No coherent footprint'],['fixed_sensor_artifact','Fixed sensor artifact'],['single_deep_glitch','Single deep glitch'],['broad_baseline_disturbance','Broad baseline disturbance'],['fragmented_noise','Fragmented noise'],['wrong_region_stronger_than_laser','Wrong region stronger than laser'],['multiple_regions','Multiple regions'],['residual_or_duplicate_transfer','Residual or duplicate'],['malformed_frame','Malformed'],['unknown','Unknown']];
async function api(path,options){const response=await fetch(path,options),data=await response.json();if(!response.ok)throw Error(data.error||response.status);return data}function message(text,type=''){ $('message').textContent=text;$('message').className='message '+type;$('topStatus').textContent=text||'Ready'}async function action(fn){if(busy)return;busy=true;try{await fn()}catch(e){message(e.message,'error')}finally{busy=false}}
async function refresh(){state=await api('/api/state');const p=state.progress;$('dashboard').innerHTML=`<b>Captured ${p.captured}</b> | Accepted ${p.accepted} | Rejected ${p.rejected} | Outliers reviewed ${p.outliers_reviewed} | False triggers reviewed ${p.false_triggers_reviewed}`;$('captureState').textContent=state.capture?`${state.capture.persisted}/${state.capture.target} persisted`:'';if(state.ready){analysis=await api('/api/analysis');await loadQueue(mode)}}async function loadQueue(nextMode){mode=nextMode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));let endpoint=mode==='annotate'?'unannotated':mode==='outliers'?'outliers':mode==='false_triggers'?'false_triggers':'outliers';const data=await api('/api/queue?mode='+endpoint);queue=data.items;position=0;$('queueState').textContent=`${queue.length} frames in ${mode}`;if(queue.length)await loadFrame(queue[0].index);else{current=null;draw();message('No frames in this review queue.','success')}}
async function loadFrame(index){const item=await api('/api/frame?index='+index);current=item;const annotation=item.annotation||{};left=annotation.manual_left_edge??null;right=annotation.manual_right_edge??null;$('status').value=annotation.status==='uncertain'?'uncertain':'accepted';$('confidence').value=annotation.confidence||'high';$('assessment').value=annotation.detector_region_assessment||'not_assessed';$('note').value=annotation.note||'';$('reviewNote').value=annotation.review_note||'';$('frameStatus').textContent=(annotation.status||'unannotated').toUpperCase();$('frameNumber').textContent=`${item.record.sequence} | queue ${position+1}/${queue.length}`;configureReview(annotation);dirty=false;draw();showDiagnostics()}
function configureReview(a){const select=$('reviewDisposition');select.innerHTML='';const options=mode==='false_triggers'?falseOptions:outlierOptions;options.forEach(([v,t])=>select.add(new Option(t,v)));select.value=mode==='false_triggers'?(a.false_trigger_family||'unreviewed'):(a.outlier_disposition||'unreviewed');$('reviewLabel').textContent=mode==='false_triggers'?'False-trigger family':'Outlier disposition';$('reviewFields').style.display=mode==='annotate'?'none':'block';$('annotationFields').style.display=mode==='false_triggers'?'none':'block';$('reject').style.display=mode==='false_triggers'?'none':'block';$('panelTitle').textContent=mode==='annotate'?'Blind annotation':mode==='outliers'?'Accepted outlier review':mode==='false_triggers'?'False-trigger review':'Detector evidence review'}
function sx(v){return v/(current.pixels.length-1)*canvas.width}function px(e){const b=canvas.getBoundingClientRect();return Math.max(0,Math.min(current.pixels.length-1,(e.clientX-b.left)/b.width*(current.pixels.length-1)))}function line(v,color,w=2,dash=[]){if(v==null)return;ctx.save();ctx.strokeStyle=color;ctx.lineWidth=w;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(sx(v),0);ctx.lineTo(sx(v),canvas.height);ctx.stroke();ctx.restore()}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);if(!current)return;const p=current.pixels,d=current.record.detection;for(let i=0;i<=20;i++){const x=i/20*canvas.width;ctx.strokeStyle='#203344';ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvas.height);ctx.stroke();ctx.fillStyle='#91a9bd';ctx.fillText(Math.round(i/20*(p.length-1)),x+2,canvas.height-7)}ctx.strokeStyle='#49cfff';ctx.beginPath();p.forEach((v,i)=>{const x=i/(p.length-1)*canvas.width,y=canvas.height-v/65535*canvas.height;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();if((!$('blind').checked||mode!=='annotate')&&overlays){line(d.start,'#f4bc50',2,[5,3]);line(d.end,'#f4bc50',2,[5,3]);[['sustained_edge_center','#66d99a'],['boundary_center','#579fff'],['quantile_center','#ffd166'],['centroid','#ff7d89'],['deep_core_center','#ba91ff']].forEach(v=>line(d[v[0]],v[1]))}line(left,activeEdge===0?'white':'#73d8ff',3);line(right,activeEdge===1?'white':'#73d8ff',3);const mid=left!=null&&right!=null?(left+right)/2:null;line(mid,'#ffd166',3);$('leftText').textContent=left==null?'n/a':left.toFixed(1);$('rightText').textContent=right==null?'n/a':right.toFixed(1);$('widthText').textContent=mid==null?'n/a':(right-left).toFixed(1);$('midText').textContent=mid==null?'n/a':mid.toFixed(1)}function showDiagnostics(){if(!current)return;const d=current.record.detection,a=current.annotation||{},m=a.manual_midpoint;const values={manual_midpoint:m,sustained_error:m==null?null:d.sustained_edge_center-m,boundary_error:m==null?null:d.boundary_center-m,quantile_error:m==null?null:d.quantile_center-m,width:d.width,integrated_drop:d.integrated_drop,peak_drop:d.peak_drop,active_coverage:d.active_coverage,largest_gap:d.largest_internal_gap,shape_score:d.shape_score,center_disagreement:d.center_disagreement};$('diagnostics').textContent=JSON.stringify(values,null,2)}
canvas.onclick=e=>{if(!current||mode==='false_triggers')return;const v=px(e);if(left==null){left=v;activeEdge=0}else if(right==null){right=v;activeEdge=1}else if(Math.abs(v-left)<Math.abs(v-right)){left=v;activeEdge=0}else{right=v;activeEdge=1}if(left!=null&&right!=null&&left>right)[left,right]=[right,left];dirty=true;draw()};canvas.onmousemove=e=>{if(current)$('cursorText').textContent=px(e).toFixed(1)};async function navigate(delta){if(dirty&&!confirm('Discard unsaved changes?'))return;position=Math.max(0,Math.min(queue.length-1,position+delta));if(queue.length)await loadFrame(queue[position].index)}async function save(advance){if(mode!=='false_triggers'&&(left==null||right==null)){message('Select both edges first.','error');return}await action(async()=>{const previous=current.annotation||{};const body={...previous,study_frame_id:current.record.study_frame_id,status:mode==='false_triggers'?'rejected':$('status').value,manual_left_edge:left,manual_right_edge:right,confidence:$('confidence').value,detector_region_assessment:$('assessment').value,note:$('note').value,review_note:$('reviewNote').value,outlier_disposition:mode==='outliers'||mode==='detector'?$('reviewDisposition').value:(previous.outlier_disposition||'unreviewed'),false_trigger_family:mode==='false_triggers'?$('reviewDisposition').value:(previous.false_trigger_family||'unreviewed'),rejection_reason:previous.rejection_reason||'false_trigger'};await api('/api/annotation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});dirty=false;message('Review saved.','success');analysis=await api('/api/analysis');if(advance)await navigate(1);else await loadFrame(queue[position].index)})}
function openReject(){$('rejectNote').value=$('note').value;$('rejectDialog').showModal()}async function confirmReject(){const id=current.record.study_frame_id;$('rejectDialog').close();await action(async()=>{await api('/api/annotation',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({study_frame_id:id,status:'rejected',rejection_reason:$('rejectReason').value,false_trigger_family:$('falseFamily').value,note:$('rejectNote').value,detector_region_assessment:$('assessment').value})});message('Frame rejected and retained for detector analysis.','success');await loadQueue('annotate')})}
$('start').onclick=()=>action(async()=>{const r=await api('/api/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({study_name:$('studyName').value,session_label:$('session').value,operator:$('operator').value,target:+$('target').value})});$('studyBadge').textContent=$('studyName').value+' / '+$('session').value;message(r.directory,'success');await refresh()});$('stop').onclick=()=>action(async()=>{await api('/api/stop',{method:'POST'});await refresh()});$('open').onclick=()=>action(async()=>{await api('/api/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:$('studyPath').value})});$('studyBadge').textContent='Existing study';await refresh()});document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>action(()=>loadQueue(b.dataset.mode)));$('previous').onclick=()=>navigate(-1);$('next').onclick=()=>navigate(1);$('clear').onclick=()=>{left=right=null;dirty=true;draw()};$('save').onclick=()=>save(false);$('saveNext').onclick=()=>save(true);$('reject').onclick=openReject;$('cancelReject').onclick=()=>$('rejectDialog').close();$('confirmReject').onclick=confirmReject;$('reveal').onclick=()=>{overlays=!overlays;$('reveal').textContent=overlays?'Hide overlays':'Reveal overlays';draw()};$('blind').onchange=draw;$('report').onclick=()=>action(async()=>{const r=await api('/api/report',{method:'POST'});message('Report generated.','success');window.open(r.url,'_blank','noopener')});refresh();
</script></body></html>
