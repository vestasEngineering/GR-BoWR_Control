<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LISM Laser Viewer</title><style>
body{font-family:system-ui;background:#10141b;color:#e8eef7;margin:0;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.card{background:#19212d;padding:14px;border-radius:10px}button{padding:10px 14px;margin:4px;background:#2d7ff9;color:white;border:0;border-radius:7px}button.warn{background:#c47d14}svg{width:100%;height:360px;background:#080b10;border-radius:10px}.good{color:#64d98b}.bad{color:#ff6b6b}.muted{color:#9eabc0}</style></head><body>
<h1>LISM Instantaneous Laser Profile</h1><div><button class="warn" onclick="cmd('calibrate/dark')">Zero calibration, laser OFF</button><button onclick="cmd('calibrate/laser')">Laser calibration, laser ON</button><button onclick="cmd('log/start')">Start CSV Log</button><button onclick="cmd('log/stop')">Stop CSV Log</button></div>
<p id="message" class="muted">Connecting...</p><svg viewBox="0 0 1000 360" preserveAspectRatio="none"><polyline id="line" fill="none" stroke="#43d5ff" stroke-width="2" vector-effect="non-scaling-stroke"/></svg><div class="grid" id="stats"></div><script>
async function cmd(path){message.textContent='Working...';let r=await fetch('/api/'+path,{method:'POST'});let j=await r.json();message.textContent=r.ok?JSON.stringify(j):j.error}function fmt(v,n=2){return v==null?'n/a':Number(v).toFixed(n)}
async function poll(){try{let r=await fetch('/api/status'),s=await r.json(),a=s.profile||[],max=Math.max(1,...a),min=Math.min(...a,0);line.setAttribute('points',a.map((v,i)=>`${i*1000/Math.max(1,a.length-1)},${350-(v-min)*340/Math.max(1,max-min)}`).join(' '));stats.innerHTML=`<div class="card">State<br><b>${s.state}</b></div><div class="card">Detected<br><b class="${s.detected?'good':'bad'}">${!!s.detected}</b></div><div class="card">Polarity<br><b>${s.polarity??'n/a'}</b></div><div class="card">Centroid<br><b>${fmt(s.centroid,3)}</b></div><div class="card">Peak pixel<br><b>${s.peak_pixel??'n/a'}</b></div><div class="card">Region<br><b>${s.region_start??'n/a'} to ${s.region_end??'n/a'} (${s.region_width??0}px)</b></div><div class="card">Amplitude<br><b>${fmt(s.amplitude,1)}</b></div><div class="card">Integrated signal<br><b>${fmt(s.integrated_signal,1)}</b></div><div class="card">SNR<br><b>${fmt(s.snr,1)}</b></div><div class="card">Raw range<br><b>${fmt(s.raw_min,0)} to ${fmt(s.raw_max,0)}</b></div><div class="card">Clipping<br><b class="${s.low_clipped||s.high_clipped?'bad':'good'}">low ${!!s.low_clipped}, high ${!!s.high_clipped}</b></div><div class="card">Calibration<br><b>dark ${!!s.calibrated}, laser ${!!s.laser_calibrated}</b></div>`;if(s.error)message.textContent=s.error}catch(e){message.textContent=e}setTimeout(poll,100)}poll();
</script></body></html>
